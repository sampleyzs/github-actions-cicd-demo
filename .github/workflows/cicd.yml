name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-build:
    name: 测试并构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行单元测试
        run: python -m unittest discover -s tests -v

      - name: 构建可执行程序及校验文件
        run: python scripts/build.py

      - name: 冒烟测试
        run: |
          python dist/cicd-demo.pyz --version
          python dist/cicd-demo.pyz greet "GitHub Actions"
          test "$(python dist/cicd-demo.pyz add 1 2 3.5)" = "6.5"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载已通过测试的构建产物
        uses: actions/download-artifact@v4
        with:
          name: cicd-demo-package
          path: dist/

      - name: 创建 Release 并附加产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/cicd-demo.pyz dist/SHA256SUMS.txt
          --title "${GITHUB_REF_NAME}"
          --generate-notes
